---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  register: apt_cache_update
  timeout: 300
  retries: 3
  until: apt_cache_update is not failed

# ACL Required for become to an unprivileged user to work
# Ensure up-to-date CA certificates
# Use linux-generic to track linux-modules-extra (IB)
- name: Install common packages # noqa package-latest
  ansible.builtin.apt:
    pkg:
      - acl
      - ca-certificates
      - linux-generic
    state: latest

# Boot into any newly-installed kernel so that the old one can be removed
- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: linux_common_reboot_required

- name: Reboot into the new kernel
  ansible.builtin.reboot:
  when: linux_common_reboot_required.stat.exists

- name: Refresh facts after reboot
  ansible.builtin.setup:
  when: linux_common_reboot_required.stat.exists

# Enables the ansible-init system, but does not install any default playbooks
- name: Ensure ansible-init is configured
  ansible.builtin.include_role:
    name: azimuth_cloud.image_utils.linux_ansible_init

# Enables volumes to be referred to by tag for setting up mounts in cloud-config
- name: Ensure volumes can be mounted by tag
  ansible.builtin.include_role:
    name: linux-volumes-by-tag

- name: Load relevant kernel modules
  ansible.builtin.template:
    src: modules.conf.j2
    dest: /etc/modules-load.d/modules.conf
    mode: "0644"
    owner: root
    group: root

# The cloud-init netplan renderer is default for ubuntu
# but does not support InfiniBand devices
- name: Switch cloud-init to alternative network renderer and activator
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/10_networkd.cfg
    mode: "0644"
    owner: root
    group: root
    content: |
      ---
      merge_how:
        - name: list
          settings: [replace]
        - name: dict
          settings: [replace]
      system_info:
        network:
          renderers:
            - "networkd"
            - "network-manager"
          activators:
            - "networkd"
            - "eni"
            - "network-manager"

- name: Blacklist specified kernel modules
  community.general.kernel_blacklist:
    name: "{{ item }}"
    state: present
  loop: "{{ blacklisted_kernel_modules_default + blacklisted_kernel_modules_extra }}"
  when: (blacklisted_kernel_modules_default + blacklisted_kernel_modules_extra) | length > 0
  notify: Regenerate initramfs

- name: Set sysctl options
  ansible.posix.sysctl:
    name: "{{ item.option }}"
    value: "{{ item.value }}"
    sysctl_file: "{{ item.conf_file }}"
  loop: "{{ sysctl_options_default + sysctl_options_extra }}"

# By default apt keeps the booted kernel and one other.
# grype detects the old kernel and fails, so we must remove it.
- name: Remove old kernels and other unneeded packages # noqa command-instead-of-module
  ansible.builtin.command: >-
    apt-get autoremove --purge -y
    -o APT::Protect-Kernels=false
  environment:
    DEBIAN_FRONTEND: noninteractive
  register: linux_common_autoremove
  changed_when: "'0 to remove' not in linux_common_autoremove.stdout"

- name: Clean up after ourselves
  ansible.builtin.apt:
    clean: true
