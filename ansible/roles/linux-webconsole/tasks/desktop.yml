---
###
# These tasks set up a graphical environment for use with a VNC server
#
# Mostly borrowed from the exosphere project:
# https://github.com/exosphere-project/exosphere/
###

# Install of desktop environment sets NetworkManager to default.
# This messes up the networking and breaks the build. This prevents it becoming default.
- name: Keep networkd as the default netplan renderer
  ansible.builtin.copy:
    dest: /etc/netplan/00-network-manager-all.yaml
    content: |
      network:
        version: 2
        renderer: networkd
    mode: "0600"

# Installing network-manager before installing the desktop seems
# to preserve networking
- name: Install network-manager
  ansible.builtin.package:
    name: network-manager
    state: present

- name: Run netplan apply
  ansible.builtin.command: netplan apply
  changed_when: true

- name: Reset SSH connection after network reconfiguration
  ansible.builtin.meta: reset_connection

- name: Wait for the host to be reachable after network reconfiguration
  ansible.builtin.wait_for_connection:
    timeout: 300

# The ubuntu firefox deb is a stub to the snap store.
# This was stalling on download and making the build fail.
# Instead install firefox from Mozilla directly.
- name: Install Firefox from Mozilla's APT repository
  block:
    - name: Download Mozilla APT repository signing key
      ansible.builtin.get_url:
        url: https://packages.mozilla.org/apt/repo-signing-key.gpg
        dest: /etc/apt/keyrings/packages.mozilla.org.asc
        mode: "0644"

    - name: Read Mozilla APT repository signing key fingerprint
      ansible.builtin.command: >-
        gpg --show-keys --with-colons /etc/apt/keyrings/packages.mozilla.org.asc
      register: linux_webconsole_mozilla_key
      changed_when: false

    - name: Verify Mozilla APT repository signing key fingerprint
      ansible.builtin.assert:
        that:
          - "'fpr:::::::::35BAA0B33E9EB396F59CA838C0BA5CE6DC6315A3:' in linux_webconsole_mozilla_key.stdout"
        fail_msg: Mozilla APT repository signing key does not have the expected fingerprint

    - name: Add Mozilla APT repository
      ansible.builtin.apt_repository:
        repo: deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main
        filename: mozilla
        state: present

    # Override the ubuntu stub's epoch (1:1snap1)
    - name: Prefer packages from Mozilla's APT repository
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/mozilla
        content: |
          Package: *
          Pin: origin packages.mozilla.org
          Pin-Priority: 1000
        mode: "0644"

    - name: Install Firefox
      ansible.builtin.apt:
        name: firefox
        state: present
        update_cache: true

- name: Install graphical environment
  ansible.builtin.package:
    name: "{{ desktop_environment_package }}"
    state: present
  # Allow the package installation to take up to an hour
  async: 3600
  # But poll it every 15s
  poll: 15
  # Retry transient install failures (snap store)
  # Will continue from where it failed
  register: linux_webconsole_desktop_install
  until: linux_webconsole_desktop_install is succeeded
  retries: 3
  delay: 60

- name: Enable graphical environment
  ansible.builtin.systemd:
    name: graphical.target
    enabled: true

- name: Set graphical environment as default systemd target
  ansible.builtin.command: systemctl set-default graphical.target
  changed_when: true

- name: Create user dconf profile
  ansible.builtin.lineinfile:
    line: "{{ item }}"
    path: /etc/dconf/profile/user
    create: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - user-db:user
    - system-db:local

- name: Ensure dconf db directory exists
  ansible.builtin.file:
    path: /etc/dconf/db/local.d/locks
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Disable screen lock
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/00-screenlock
    owner: root
    group: root
    mode: "0644"
    content: |
      [org/gnome/desktop/lockdown]
      disable-lock-screen=true

      [org/gnome/desktop/screensaver]
      lock-enabled=false

      [org/gnome/desktop/session]
      idle-delay=uint32 0

- name: Override user preferences for screen lock
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/locks/screensaver
    owner: root
    group: root
    mode: "0644"
    content: |
      /org/gnome/desktop/lockdown/disable-lock-screen
      /org/gnome/desktop/screensaver/lock-enabled
      /org/gnome/desktop/session/idle-delay

- name: Update dconf database
  ansible.builtin.command: dconf update
  changed_when: true

- name: Prevent authentication prompts for updating system repos
  ansible.builtin.copy:
    dest: /etc/polkit-1/localauthority/50-local.d/46-allow-update-repo.pkla
    owner: root
    group: root
    mode: "0644"
    content: |
      [Allow Package Management all Users]
      Identity=unix-user:*
      Action=org.freedesktop.packagekit.system-sources-refresh
      ResultAny=yes
      ResultInactive=yes
      ResultActive=yes
  when:
    - ansible_facts['distribution'] == "Ubuntu"
    - ansible_facts['distribution_major_version'] == "22"

- name: Prevent authentication prompts for updating system repos
  ansible.builtin.copy:
    dest: /etc/polkit-1/rules.d/46-allow-update-repo.rules
    owner: root
    group: root
    mode: "0644"
    content: |
      polkit.addRule(function(action, subject) {
        if (action.id == "org.freedesktop.packagekit.system-sources-refresh"
        {
          return polkit.Result.YES;
        }
      });
  when:
    - ansible_facts['distribution'] == "Ubuntu"
    - ansible_facts['distribution_major_version'] == "24"
