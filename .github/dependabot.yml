---

version: 2

updates:
  # Automatically propose PRs for out-of-date GitHub actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # Check for new versions weekly
      interval: weekly
    # Update all actions in a single PR
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - automation
      - gha-update
    # Only allow updates for actions maintained by GitHub, us and astral
    allow:
      - dependency-name: "actions/*"
      - dependency-name: "azimuth-cloud/github-actions/*"
      - dependency-name: "astral-sh/setup-uv@*"

    cooldown:
      default-days: 7
