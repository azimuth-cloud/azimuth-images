---
name: Flatcar sysexts

on:  # yamllint disable-line rule:truthy
  # Allow manual executions
  workflow_dispatch:
    inputs:
      force-push:
        description: "Re-push sysexts even if they already exist in S3"
        type: boolean
        default: false
  # Run weekly on Monday at 02:00 UTC
  schedule:
    - cron: "0 2 * * 1"

jobs:
  push_sysexts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install s3cmd and squashfs-tools
        run: sudo apt-get update -y && sudo apt-get install -y s3cmd squashfs-tools

      - name: Push sysexts to S3 and update manifest
        run: ./bin/flatcar-push-sysexts
        env:
          S3_HOST: ${{ vars.CLOUDFLARE_S3_HOST }}
          S3_HOST_PUBLIC_PATH: ${{ vars.CLOUDFLARE_S3_HOST_PUBLIC_PATH }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_KEY }}
          FORCE_PUSH: ${{ inputs.force-push }}
          GH_TOKEN: ${{ github.token }}

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate SBOMs and sign sysexts
        run: ./bin/flatcar-sbom-sysexts
        env:
          S3_HOST: ${{ vars.CLOUDFLARE_S3_HOST }}
          S3_HOST_PUBLIC_PATH: ${{ vars.CLOUDFLARE_S3_HOST_PUBLIC_PATH }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_KEY }}
          FORCE_PUSH: ${{ inputs.force-push }}

      - name: Generate app token for PR
        uses: azimuth-cloud/github-actions/generate-app-token@master
        id: generate-app-token
        with:
          repository: ${{ github.repository }}
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          app-private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Propose changes via PR if required
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0 # v8.1.0
        with:
          token: ${{ steps.generate-app-token.outputs.token }}
          commit-message: "feat(flatcar): update sysext manifest"
          branch: update/flatcar-sysext-manifest
          delete-branch: true
          title: "feat(flatcar): update sysext manifest"
          body: |
            Automatic update of `vars/flatcar/sysext-manifest.json` with
            S3 URLs, SHA256 checksums, SBOMs and cosign signatures
            for the current Flatcar sysexts.

            Generated by GitHub Actions.
          labels: |
            automation
            flatcar
