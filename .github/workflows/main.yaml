---
name: Build and test main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main
    # The image build must run for every commit on main,
    # otherwise a tag pointing at a "skipped" commit has no manifest
    # to promote and the release workflow fails.

jobs:
  # Build, publish and test the images
  build_test_images:
    uses: ./.github/workflows/build_test_images.yaml
    permissions:
      actions: read
      contents: write
      packages: write
      id-token: write # required to get an OIDC token for signing
      security-events: write # required to upload SARIF files
      checks: write
    secrets:
      OS_CLOUDS: ${{ secrets.OS_CLOUDS }}
      CLOUDFLARE_S3_ACCESS_KEY: ${{ secrets.CLOUDFLARE_S3_ACCESS_KEY }}
      CLOUDFLARE_S3_SECRET_KEY: ${{ secrets.CLOUDFLARE_S3_SECRET_KEY }}
